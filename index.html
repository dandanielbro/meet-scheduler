<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>喬時間</title>
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --ink: #1f2328; --muted: #6b7078; --line: #e3e1da;
  --off: #2f9e5f; --off-soft: #d6efe0; --on: #3a78d6; --on-soft: #dbe7fa;
  --warn: #c9502c; --warn-soft: #fbe5dc; --pin: #8a5cd0; --pin-soft: #ebe1f8;
  --accent: #1f2328; --cell: #eeece6; --rowh: 28px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16181b; --card: #1f2226; --ink: #eceef0; --muted: #9aa0a8; --line: #33373d;
    --off: #3fbf76; --off-soft: #1f3a2a; --on: #5b95ea; --on-soft: #1e2d45;
    --warn: #ef7a55; --warn-soft: #3d2620; --pin: #b08cf0; --pin-soft: #2f2640;
    --accent: #eceef0; --cell: #2a2e33;
  }
}
* { box-sizing: border-box; }
/* 點兩下不會放大畫面（兩指縮放還是可以） */
html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 8px 16px 16px; }
.foot { max-width: 720px; margin: 0 auto; padding: 16px 16px 96px; border-top: 1px solid var(--line);
  color: var(--muted); font-size: 13px; text-align: center; }
h1 { font-size: 24px; margin: 8px 0 2px; }
h2 { font-size: 18px; margin: 0 0 10px; }
p { margin: 6px 0; }
a { color: var(--on); }
.muted { color: var(--muted); font-size: 14px; }
.card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 14px 0; color: inherit; text-decoration: none; }
label, .label { display: block; font-weight: 600; margin: 16px 0 6px; }
textarea { resize: vertical; line-height: 1.5; }
input, select, textarea { width: 100%; font: inherit; font-size: 16px;  /* 小於 16px 的話 iPhone 點下去會自動放大 */
  color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 10px; padding: 9px 14px; cursor: pointer; text-decoration: none; display: inline-block; white-space: nowrap; }
.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .45; cursor: default; }
button.link { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 4px 0; font-size: 14px; }
button.small { padding: 4px 10px; font-size: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1; min-width: 0; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 14px; margin: 8px 0; }
.banner select { width: auto; padding: 4px 8px; font-size: 16px; margin-left: 6px; }

/* 頂部 */
.top { max-width: 720px; margin: 0 auto; padding: 12px 16px 0; display: flex; align-items: center; gap: 10px; }
.brand { font-weight: 800; font-size: 18px; color: var(--ink); text-decoration: none; }
.who { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center; background: var(--cell); color: var(--ink); font-size: 13px; font-weight: 700; }

/* 活動列表 */
.ev .st { margin-top: 8px; font-size: 15px; }
.tag { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted); }
.tag.warn { border-color: var(--warn); color: var(--warn); }
details.past summary { cursor: pointer; color: var(--muted); margin: 18px 0 4px; }

/* 發起表單 */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal .wd { font-size: 12px; color: var(--muted); padding: 2px 0; }
.cal button { padding: 0; height: 40px; font-size: 14px; border-radius: 8px; background: var(--bg); }
.cal button.sel { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
.cal button.past { opacity: .3; cursor: default; }
.cal button.m1 { font-size: 12px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button.on { outline: 2px solid var(--accent); outline-offset: 1px; font-weight: 700; }
.two { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }

/* 成員 */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px 4px 4px; font-size: 14px; border: 1px solid var(--line); background: var(--bg); }
.chip.done { border-color: var(--off); }
.mrow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.mrow:last-child { border-bottom: 0; }
button.danger { color: var(--warn); border-color: var(--warn); }

/* 結果 */
.status { border-radius: 12px; padding: 14px; }
.status.ok-off { background: var(--off-soft); }
.status.ok-on { background: var(--on-soft); }
.status.warn { background: var(--warn-soft); }
.status.wait { background: var(--cell); }
.status.decided { background: var(--pin-soft); }
.status h2 { margin-bottom: 6px; }
.status ul { margin: 6px 0 0; padding-left: 20px; }
.status li { margin: 4px 0; }
.status li button { margin-left: 6px; }

/* 時間格 */
.toolbar { display: flex; gap: 8px; margin: 8px 0 10px; }
.brush { flex: 1; min-width: 0; padding: 9px 6px; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.brush.active { outline: 2px solid var(--accent); outline-offset: 1px; font-weight: 700; }
.dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; vertical-align: -1px; }
.dot.off { background: var(--off); } .dot.on { background: var(--on); } .dot.no { background: var(--cell); border: 1px solid var(--line); }
.pager { display: flex; align-items: center; gap: 8px; margin: 6px 0 8px; }
.pager span { flex: 1; text-align: center; font-size: 14px; color: var(--muted); }
.grid { display: grid; gap: 3px; user-select: none; -webkit-user-select: none; }
.grid .head { text-align: center; font-size: 13px; font-weight: 600; padding: 6px 0; border-radius: 8px; }
.grid .head.tap { cursor: pointer; background: var(--cell); }
.grid .time { font-size: 12px; color: var(--muted); text-align: right; padding-right: 6px; line-height: var(--rowh); height: var(--rowh); }
.grid .cell { height: var(--rowh); border-radius: 5px; background: var(--cell); }
.editor .cell { touch-action: none; cursor: pointer; }
.cell.v2 { background: var(--off); }
.cell.v1 { background: var(--on); }
.heat .cell { font-size: 12px; text-align: center; line-height: var(--rowh); color: var(--muted); cursor: pointer; }
.heat .cell.all-off { background: var(--off); color: #fff; font-weight: 600; }
.heat .cell.all-on { background: var(--on); color: #fff; font-weight: 600; }
.heat .cell.sel { outline: 2px solid var(--accent); }
.detail { min-height: 22px; font-size: 14px; margin-top: 10px; }
.link-box { display: flex; gap: 8px; margin: 6px 0 12px; }
.link-box input { font-size: 16px; min-width: 0; }

.savebar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--warn-soft); border-top: 2px solid var(--warn);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: none; z-index: 5; }
.savebar.show { display: block; }
.savebar .inner { max-width: 720px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.savebar .inner span { color: var(--warn); font-weight: 700; font-size: 15px; line-height: 1.35; }
/* 儲存按鈕：大、橘色、會呼吸，提醒畫完要按 */
button.save-cta { background: var(--warn); border-color: var(--warn); color: #fff; font-weight: 700; font-size: 17px; padding: 12px 22px;
  animation: pulse 1.6s ease-out infinite; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--warn) 55%, transparent); }
  70%, 100% { box-shadow: 0 0 0 12px transparent; }
}
@media (prefers-reduced-motion: reduce) { button.save-cta { animation: none; } }
.save-inline { margin-top: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.save-inline .saved { color: var(--off); font-weight: 700; }
/* 自動儲存倒數：橘色長條從滿縮到空 */
.countdown { height: 8px; border-radius: 999px; overflow: hidden; background: color-mix(in srgb, var(--warn) 22%, transparent); }
.countdown i { display: block; height: 100%; background: var(--warn); border-radius: inherit;
  transform-origin: left center; animation-name: drain; animation-timing-function: linear; animation-fill-mode: both; }
@keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.save-inline .countdown { flex-basis: 100%; }
.savebar .countdown { max-width: 720px; margin: 0 auto 10px; }
.toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: var(--accent); color: var(--bg);
  padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="app"><p class="muted">載入中…</p></main>
<footer class="foot">
  <p style="margin:0 0 12px"><button type="button" id="shareApp">📣 把喬時間分享給朋友</button></p>
  這個小工具是吞吞做的。<br>有想回饋的地方，或想請我幫忙做點什麼，歡迎到 IG 找我

</footer>
<div class="savebar" id="savebar"><div id="saveCd"></div><div class="inner">
  <span class="grow" id="saveMsg">停手 2 秒會自動儲存<br>也可以直接按</span>
  <button type="button" class="save-cta" data-save>儲存我的時間</button>
</div></div>
<div class="toast" id="toast"></div>
