<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>週末喬時間</title>
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --ink: #1f2328; --muted: #6b7078; --line: #e3e1da;
  --off: #2f9e5f; --off-soft: #d6efe0; --on: #3a78d6; --on-soft: #dbe7fa;
  --warn: #c9502c; --warn-soft: #fbe5dc; --accent: #1f2328; --cell: #eeece6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16181b; --card: #1f2226; --ink: #eceef0; --muted: #9aa0a8; --line: #33373d;
    --off: #3fbf76; --off-soft: #1f3a2a; --on: #5b95ea; --on-soft: #1e2d45;
    --warn: #ef7a55; --warn-soft: #3d2620; --accent: #eceef0; --cell: #2a2e33;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 20px 16px 96px; }
h1 { font-size: 24px; margin: 4px 0 4px; }
h2 { font-size: 18px; margin: 0 0 10px; }
p { margin: 6px 0; }
.muted { color: var(--muted); font-size: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 14px 0; }
label { display: block; font-weight: 600; margin: 14px 0 6px; }
input, textarea, select { width: 100%; font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea { min-height: 110px; resize: vertical; }
button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 10px; padding: 9px 14px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1; min-width: 0; }
.link-box { display: flex; gap: 8px; margin: 6px 0 12px; }
.link-box input { font-size: 13px; min-width: 0; }
.link-box button { flex-shrink: 0; white-space: nowrap; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 14px; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border-radius: 999px; padding: 5px 12px; font-size: 14px; border: 1px solid var(--line); background: var(--bg); }
.chip.done { border-color: var(--off); color: var(--off); }
.chip.me { background: var(--accent); color: var(--bg); border-color: var(--accent); }
button.chip { padding: 6px 14px; }

/* 結果 */
.status { border-radius: 12px; padding: 14px; margin: 0; }
.status.ok-off { background: var(--off-soft); }
.status.ok-on { background: var(--on-soft); }
.status.warn { background: var(--warn-soft); }
.status.wait { background: var(--cell); }
.status h2 { margin-bottom: 6px; }
.status ul { margin: 6px 0 0; padding-left: 20px; }
.status li { margin: 3px 0; }

/* 時間格 */
.toolbar { display: flex; gap: 8px; margin: 8px 0 10px; flex-wrap: wrap; }
.brush { flex: 1; min-width: 0; padding: 9px 6px; white-space: nowrap; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.brush.active { outline: 2px solid var(--accent); outline-offset: 1px; font-weight: 700; }
.dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.dot.off { background: var(--off); } .dot.on { background: var(--on); } .dot.no { background: var(--cell); border: 1px solid var(--line); }
.grid { display: grid; grid-template-columns: 52px repeat(3, 1fr); gap: 3px; user-select: none; -webkit-user-select: none; }
.grid .head { text-align: center; font-size: 13px; font-weight: 600; padding: 6px 0; border-radius: 8px; }
.grid .head.tap { cursor: pointer; background: var(--cell); }
.grid .time { font-size: 12px; color: var(--muted); text-align: right; padding-right: 6px; line-height: 28px; }
.grid .cell { height: 28px; border-radius: 6px; background: var(--cell); }
.editor .cell { touch-action: none; cursor: pointer; }
.cell.v2 { background: var(--off); }
.cell.v1 { background: var(--on); }
.heat .cell { font-size: 12px; text-align: center; line-height: 28px; color: var(--muted); cursor: pointer; }
.heat .cell.all-off { background: var(--off); color: #fff; font-weight: 600; }
.heat .cell.all-on { background: var(--on); color: #fff; font-weight: 600; }
.heat .cell.sel { outline: 2px solid var(--accent); }
.detail { min-height: 22px; font-size: 14px; margin-top: 10px; }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: none; }
.savebar.show { display: block; }
.savebar .inner { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: var(--accent); color: var(--bg);
  padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
a { color: var(--on); }
</style>
</head>
<body>
<main id="app"><p class="muted">載入中…</p></main>
<div class="savebar" id="savebar"><div class="inner">
  <span class="grow muted" id="savehint">你的時間還沒儲存</span>
  <button class="primary" id="saveBtn">儲存我的時間</button>
</div></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
